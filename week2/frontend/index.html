<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Item Extractor</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
        margin: 2rem auto;
        max-width: 800px;
        padding: 0 1rem;
      }
      h1 { font-size: 1.5rem; }
      textarea {
        width: 100%;
        min-height: 160px;
        font-family: ui-monospace, monospace;
      }
      button {
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      .items, .notes {
        margin-top: 1rem;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0;
      }
      .muted {
        color: #6b7280;
        font-size: 0.875rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.5rem;
      }
      h2 {
        margin-top: 2rem;
      }
    </style>
  </head>

  <body>
    <h1>Action Item Extractor</h1>
    <p class="muted">
      Paste notes and extract actionable items (Heuristic or LLM).
    </p>

    <label for="text">Notes</label>
    <textarea id="text" placeholder="Example:
- Buy milk
- Finish homework"></textarea>

    <div class="row">
      <label class="row">
        <input id="save_note" type="checkbox" checked />
        Save as note
      </label>

      <button id="extract">Extract (Heuristic)</button>
      <button id="extract-llm">Extract (LLM)</button>
      <button id="list-notes">List Notes</button>
    </div>

    <div class="items" id="items"></div>

    <h2>Saved Notes</h2>
    <div class="notes" id="notes"></div>

    <script>
      const $ = (sel) => document.querySelector(sel);

      const itemsEl = $('#items');
      const notesEl = $('#notes');

      const extractBtn = $('#extract');
      const extractLLMBtn = $('#extract-llm');
      const listNotesBtn = $('#list-notes');

      async function extractItems(endpoint) {
        const text = $('#text').value;
        const save = $('#save_note').checked;

        if (!text.trim()) {
          itemsEl.innerHTML = '<p class="muted">Please enter some text.</p>';
          return;
        }

        itemsEl.textContent = 'Extracting...';

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, save_note: save }),
          });

          if (!res.ok) throw new Error('Request failed');

          const data = await res.json();

          if (!data.items || data.items.length === 0) {
            itemsEl.innerHTML = '<p class="muted">No action items found.</p>';
            return;
          }

          itemsEl.innerHTML = data.items.map(it => `
            <div class="item">
              <input type="checkbox" data-id="${it.id}" />
              <span>${it.text}</span>
            </div>
          `).join('');

          // mark done
          itemsEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', async (e) => {
              const id = e.target.getAttribute('data-id');
              await fetch(`/action-items/${id}/done`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done: e.target.checked }),
              });
            });
          });

        } catch (err) {
          console.error(err);
          itemsEl.textContent = 'Error extracting items.';
        }
      }

      extractBtn.addEventListener('click', () => {
        extractItems('/action-items/extract');
      });

      extractLLMBtn.addEventListener('click', () => {
        extractItems('/action-items/extract-llm');
      });

      listNotesBtn.addEventListener('click', async () => {
        notesEl.textContent = 'Loading notes...';

        try {
          const res = await fetch('/notes');
          if (!res.ok) throw new Error('Failed to load notes');

          const notes = await res.json();

          if (!notes.length) {
            notesEl.innerHTML = '<p class="muted">No notes saved yet.</p>';
            return;
          }

          notesEl.innerHTML = notes.map(n => `
            <div class="item">
              <strong>#${n.id}</strong> - ${n.content}
              <span class="muted">(${n.created_at})</span>
            </div>
          `).join('');

        } catch (err) {
          console.error(err);
          notesEl.textContent = 'Error loading notes.';
        }
      });
    </script>
  </body>
</html>
